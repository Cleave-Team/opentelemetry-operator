name: "Publish Python 3.12 Auto-Instrumentation to AWS ECR"

on:
  push:
    branches:
      - python3.12
    paths:
      - "autoinstrumentation/python/**"
      - ".github/workflows/publish-python312-ecr.yaml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version
        run: echo VERSION=$(head -n 1 autoinstrumentation/python/requirements.txt | cut -d '=' -f3) >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
  
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
  
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/autoinstrumentation-python
          tags: |
            type=raw,value=3.12-${{ env.VERSION }}
            type=raw,value=3.12-latest
            type=sha,prefix=3.12-

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: autoinstrumentation/python
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: version=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/autoinstrumentation-python:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/autoinstrumentation-python:buildcache,mode=max

      - name: Output image details
        run: |
          echo "Image pushed to ECR:"
          echo "${{ steps.meta.outputs.tags }}"
